<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KBO 승부 예측</title>
    <meta name="description" content="확정 라인업 OPS, 선발 FIP와 불펜 등판 기록 기반 KBO 득점 예측 및 독립 검증 상태" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KBO 승부 예측" />
    <meta property="og:description" content="확정 라인업 기반 KBO 득점·승률 예측과 독립 검증 상태" />
    <meta property="og:site_name" content="KBO 승부 예측" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KBO 승부 예측" />
    <meta name="twitter:description" content="확정 라인업 기반 KBO 득점·승률 예측과 독립 검증 상태" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1>KBO 승부 예측</h1>
      </header>

      <section class="meta">
        <p id="statusText">데이터를 불러오는 중...</p>
        <div id="modelStatusRow" class="model-status-row" aria-live="polite"></div>
        <div class="meta-actions">
          <button id="refreshButton">최신 데이터 새로고침</button>
        </div>
      </section>

      <section class="daily-predictions">
        <div class="daily-header">
          <h2>확정 라인업 경기 예측</h2>
          <p id="dailyDateText">-</p>
        </div>
        <div id="dailySummaryList" class="daily-summary-list" aria-label="경기별 예측 요약"></div>
        <div id="dailyPredictionsList" class="daily-list">
          <p class="daily-empty">경기 예측을 불러오는 중...</p>
        </div>
      </section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>순위</th>
              <th>팀</th>
              <th>경기</th>
              <th>득점</th>
              <th>실점</th>
              <th>피타고리안</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </section>

      <section class="table-wrap metrics-wrap">
        <h3 class="table-subtitle">팀 지표 상세</h3>
        <table id="metricsTable">
          <thead>
            <tr>
              <th class="metric-help" data-sort-field="team" title="팀명">팀</th>
              <th class="metric-help" data-sort-field="games" title="현재까지 치른 경기 수">경기</th>
              <th class="metric-help" data-sort-field="offenseRpg" title="경기당 평균 득점 (높을수록 공격력 우세)">득점R/G</th>
              <th class="metric-help" data-sort-field="defenseRpg" title="경기당 평균 실점 (낮을수록 수비력 우세)">실점R/G</th>
              <th class="metric-help" data-sort-field="battingAvg" title="팀 타율 (높을수록 우세)">AVG</th>
              <th class="metric-help" data-sort-field="hrPerGame" title="경기당 팀 홈런 (높을수록 장타력 우세)">HR/G</th>
              <th class="metric-help" data-sort-field="teamEra" title="팀 평균자책점 ERA (낮을수록 우세)">팀ERA</th>
              <th class="metric-help" data-sort-field="teamWhip" title="팀 WHIP (이닝당 출루 허용, 낮을수록 우세)">WHIP</th>
              <th class="metric-help" data-sort-field="bullpenUsagePerGame" title="팀 세이브·홀드의 경기당 합계. 실제 불펜 투구량·휴식 지표는 아닙니다.">SV+HLD/G</th>
              <th class="metric-help" data-sort-field="kbbRatio" title="팀 전체 삼진/볼넷 비율. 불펜 전용 기록이 아닙니다.">팀 K/BB</th>
            </tr>
          </thead>
          <tbody id="metricsTableBody"></tbody>
        </table>
      </section>
    </main>

    <script src="/main.js"></script>
  </body>
</html>
